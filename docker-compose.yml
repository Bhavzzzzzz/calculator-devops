name: calculator

services:
  calculator:
    image: ${DOCKER_IMAGE:-bhavyajain1098/calculator}:${IMAGE_TAG:-latest}
    build: .
    environment:
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: calculator
    deploy:
      replicas: 2
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - calc-net

  nginx:
    image: calculator-nginx:latest
    build: ./nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      calculator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - calc-net

networks:
  calc-net:
    driver: bridge
